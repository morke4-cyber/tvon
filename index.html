<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sala de tela</title>
<style>
:root{--bg:#14172b;--panel:#1d2140;--tx:#e8ecf8;--mute:#98a0c4;--ac:#5cc8ff;--bad:#ff6b8a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{padding:14px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:600}
#status{color:var(--mute);font-size:14px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px 16px;min-height:0}
.card{background:var(--panel);border-radius:14px;padding:28px;max-width:440px;width:100%}
.card h2{margin:0 0 8px;font-size:22px}
.card p{color:var(--mute);margin:0 0 18px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
select,input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #343a6b;background:#12152a;color:var(--tx);font:inherit}
button{padding:11px 18px;border:0;border-radius:8px;background:var(--ac);color:#06202e;font:inherit;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.sec{background:#2b3160;color:var(--tx)}
#go{width:100%;margin-top:18px}
#stage{flex:1;width:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar input{flex:1;min-width:180px}
.bar span{color:var(--mute);font-size:14px}
video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000;border-radius:10px}
.err{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>Sala de tela</h1>
  <span id="status"></span>
  <span id="dbg" style="color:var(--mute);font-size:12px"></span>
</header>
<main>
  <section id="home" class="card" hidden>
    <h2>Transmitir sua tela</h2>
    <p>Escolha a tela ou aba e envie o link para seus amigos. Eles veem ao vivo, sem instalar nada.</p>
    <label for="rate">Qualidade do vídeo (quanto maior, mais internet de envio)</label>
    <select id="rate">
      <option value="6">Boa (6 Mbps)</option>
      <option value="10" selected>Muito boa (10 Mbps)</option>
      <option value="15">Máxima (15 Mbps)</option>
    </select>
    <button id="go">Escolher tela e transmitir</button>
    <p style="margin:14px 0 0;font-size:13px">Para enviar o som do filme, marque "Compartilhar áudio" na janela que abrir. Use Chrome ou Edge.</p>
  </section>

  <section id="stage" hidden>
    <div class="bar" id="hostbar" hidden>
      <input id="link" readonly aria-label="Link para os amigos">
      <button id="copy">Copiar link</button>
      <span id="count">0 assistindo</span>
    </div>
    <div class="bar" id="viewbar" hidden>
      <button id="sound" class="sec">Ativar som</button>
      <button id="full" class="sec">Tela cheia</button>
      <span id="info"></span>
    </div>
    <video id="video" autoplay playsinline></video>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video');
const salaURL = new URLSearchParams(location.search).get('sala');

/* Dados públicos do seu projeto Supabase (usados só para os dois lados se encontrarem). */
const SB_URL = 'https://mrnwlmgmyrtotoqnmimb.supabase.co';
const SB_KEY = 'sb_publishable_g60UNJNzbbdaWp83peoeFA_AM3VOizf';

/* Servidores de apoio à conexão. Se alguns amigos não conseguirem entrar,
   cole aqui os dados do servidor TURN gratuito (ver instruções do Claude). */
const TURN_SERVERS = [];
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, ...TURN_SERVERS] };

const status = (t, bad) => { $('status').textContent = t; $('status').className = bad ? 'err' : ''; };
const show = id => { $('home').hidden = id !== 'home'; $('stage').hidden = id !== 'stage'; };

let sb, canal, stream;
let eu = Math.random().toString(36).slice(2, 10);   // meu "endereço" na sala
const pares = {};                                    // quem transmite: um por amigo

function abrirCanal(sala, aoReceber, aoStatus) {
  if (!window.supabase) { status('Erro: não carregou o Supabase. Verifique a internet e atualize a página.', true); return false; }
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  canal = sb.channel('tela-' + sala, { config: { broadcast: { self: false } } });
  canal.on('broadcast', { event: 'sig' }, ({ payload }) => { if (payload.to === eu) aoReceber(payload); });
  canal.subscribe((st, err) => {
    if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT')
      status('Erro no servidor de encontro (Supabase): ' + ((err && err.message) || st), true);
    else aoStatus(st);
  });
  return true;
}
const enviar = (to, type, data) => canal.send({ type: 'broadcast', event: 'sig', payload: { to, from: eu, type, data } });

if (salaURL) assistir(salaURL); else show('home');
$('go').onclick = transmitir;

/* ---------- QUEM TRANSMITE ---------- */
async function transmitir() {
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 60, max: 60 }, width: { ideal: 3840 }, height: { ideal: 2160 } },
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) { status('Transmissão cancelada.', true); return; }

  const vt = stream.getVideoTracks()[0];
  vt.contentHint = 'motion';               // prioriza fluidez (fps)
  vt.onended = () => { location.href = location.pathname; };

  const id = Math.random().toString(36).slice(2, 10);
  eu = 'host';
  const ok = abrirCanal(id, async m => {
    if (m.type === 'hello') criarPar(m.from);
    const e = pares[m.from];
    if (!e) return;
    if (m.type === 'answer') {
      await e.pc.setRemoteDescription(m.data);
      e.pronto = true;
      e.fila.forEach(c => e.pc.addIceCandidate(c).catch(() => {}));
      e.fila = [];
    } else if (m.type === 'ice') {
      if (e.pronto) e.pc.addIceCandidate(m.data).catch(() => {}); else e.fila.push(m.data);
    }
  }, st => { if (st === 'SUBSCRIBED') status('Você está ao vivo'); });
  if (!ok) return;

  $('link').value = location.origin + location.pathname + '?sala=' + id;
  $('hostbar').hidden = false;
  show('stage');
  video.srcObject = stream; video.muted = true; video.play();
  status('Conectando ao servidor de encontro…');

  $('copy').onclick = async () => {
    await navigator.clipboard.writeText($('link').value);
    $('copy').textContent = 'Link copiado';
    setTimeout(() => $('copy').textContent = 'Copiar link', 1800);
  };
}

async function criarPar(amigo) {
  const velho = pares[amigo];
  if (velho && ['new', 'connecting', 'connected'].includes(velho.pc.connectionState)) return;
  if (velho) velho.pc.close();
  status('Um amigo está entrando…');
  const pc = new RTCPeerConnection(ICE);
  pares[amigo] = { pc, fila: [], pronto: false };
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  await ajustar(pc);
  pc.onicecandidate = ev => { if (ev.candidate) enviar(amigo, 'ice', ev.candidate.toJSON()); };
  pc.oniceconnectionstatechange = () => { $('dbg').textContent = 'Amigo: ' + pc.iceConnectionState; };
  pc.onconnectionstatechange = () => {
    contar();
    if (pc.connectionState === 'connected') { status('Você está ao vivo'); ajustar(pc); }
  };
  await pc.setLocalDescription(await pc.createOffer());
  enviar(amigo, 'offer', pc.localDescription.toJSON());
}

function contar() {
  const n = Object.values(pares).filter(e => e.pc.connectionState === 'connected').length;
  $('count').textContent = n + ' assistindo';
}

async function ajustar(pc) {
  const bps = Number($('rate').value) * 1e6;
  for (const s of pc.getSenders()) {
    if (!s.track || s.track.kind !== 'video') continue;
    try {
      const p = s.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      p.encodings[0].maxBitrate = bps;
      p.encodings[0].maxFramerate = 60;
      p.degradationPreference = 'maintain-framerate';   // mantém fps, cede resolução só se faltar internet
      await s.setParameters(p);
    } catch (e) { console.log(e); }
  }
}

/* ---------- QUEM ASSISTE ---------- */
function assistir(sala) {
  show('stage'); $('viewbar').hidden = false;
  status('Conectando ao servidor de encontro…');
  let pc = null, fila = [], pronto = false, recebeuOferta = false, timer;

  const espera = setTimeout(() => status(recebeuOferta
    ? 'Achou a transmissão, mas o vídeo não chegou. A rede pode estar bloqueando a conexão direta.'
    : 'Não achou a transmissão. Confira se ela continua aberta e se o link é o mais recente.', true), 20000);

  abrirCanal(sala, async m => {
    if (m.type === 'offer') {
      recebeuOferta = true;
      clearInterval(timer);
      status('Transmissão encontrada. Conectando…');
      pc = new RTCPeerConnection(ICE);
      pc.onicecandidate = ev => { if (ev.candidate) enviar('host', 'ice', ev.candidate.toJSON()); };
      pc.oniceconnectionstatechange = () => { $('dbg').textContent = 'Conexão: ' + pc.iceConnectionState; };
      pc.onconnectionstatechange = () => {
        if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) status('A transmissão terminou ou a conexão caiu.', true);
      };
      pc.ontrack = ev => {
        clearTimeout(espera);
        video.srcObject = ev.streams[0]; video.muted = true; video.play();
        status('Ao vivo');
        for (const r of pc.getReceivers()) {   // menor atraso possível
          try { r.jitterBufferTarget = 0; } catch (e) {}
          try { r.playoutDelayHint = 0; } catch (e) {}
        }
      };
      await pc.setRemoteDescription(m.data);
      pronto = true;
      fila.forEach(c => pc.addIceCandidate(c).catch(() => {}));
      fila = [];
      await pc.setLocalDescription(await pc.createAnswer());
      enviar('host', 'answer', pc.localDescription.toJSON());
    } else if (m.type === 'ice') {
      if (pronto) pc.addIceCandidate(m.data).catch(() => {}); else fila.push(m.data);
    }
  }, st => {
    if (st !== 'SUBSCRIBED') return;
    status('Procurando a transmissão…');
    enviar('host', 'hello', null);
    timer = setInterval(() => enviar('host', 'hello', null), 2000);   // repete até a transmissão responder
  });

  $('sound').onclick = () => { video.muted = false; $('sound').hidden = true; };
  $('full').onclick = () => video.requestFullscreen && video.requestFullscreen();
  video.addEventListener('resize', () => {
    $('info').textContent = video.videoWidth + '×' + video.videoHeight;
  });
}
</script>
</body>
</html>
